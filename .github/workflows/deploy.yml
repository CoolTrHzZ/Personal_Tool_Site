name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run check:pages
      - run: npm run build
        env:
          BASE_URL: ${{ vars.PAGES_BASE }}
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  pages-gate:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Detect GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          err="$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>&1 || true)"
          if printf '%s\n' "$err" | grep -qi 'Not Found'; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages::仓库还没有启用 Pages。打开 Settings → Pages → Build and deployment，Source 选 GitHub Actions。构建检查已通过，本次跳过发布。启用后再推一次 main 即可上线。"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages::无法确认 Pages 是否已启用，将尝试发布。"
          fi

  deploy:
    needs: [build, pages-gate]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.pages-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
