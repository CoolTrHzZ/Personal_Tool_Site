<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolbox Admin</title><link rel="stylesheet" href="/admin/admin.css"></head><body><main><header><h1>Toolbox Admin</h1><a href="/" target="_blank">打开站点 ↗</a></header><p id="status">本地内容管理</p><section><h2>站点配置</h2><form id="site"></form></section><section><h2>分类</h2><form id="category-form"><input type="hidden" name="originalId"><input name="id" placeholder="id" required><input name="name" placeholder="名称" required><input name="icon" placeholder="图标，如 Code2" value="Code2"><input name="order" type="number" value="10"><button>新增分类</button></form><div id="categories"></div></section><section><h2>网址</h2><form id="nav-form"><input type="hidden" name="originalId"><input name="id" placeholder="id" required><input name="name" placeholder="名称" required><input name="url" type="url" placeholder="https://example.com" required><input name="description" placeholder="描述"><input name="tags" placeholder="标签，用逗号分隔"><input name="category" placeholder="分类 id" required><input name="icon" placeholder="auto" value="auto"><input name="order" type="number" value="10"><label><input name="enabled" type="checkbox" checked> 启用</label><button>新增网址</button></form><div id="navigation"></div></section></main><script type="module" src="/admin/admin.js"></script></body></html>
