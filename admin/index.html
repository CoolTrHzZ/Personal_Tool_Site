<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolbox Admin</title><link rel="stylesheet" href="/admin/admin.css"></head><body><div class="admin-shell"><aside class="sidebar"><div class="admin-brand"><span>+</span><strong>Toolbox Admin</strong></div><nav><button class="nav-item active" data-view="dashboard">⌂ <span>Dashboard</span></button><button class="nav-item" data-view="websites">◎ <span>Websites</span></button><button class="nav-item" data-view="tools">◇ <span>Tools</span></button><button class="nav-item" data-view="categories">□ <span>Categories</span></button><button class="nav-item" data-view="settings">⚙ <span>Settings</span></button></nav><a class="site-link" href="/" target="_blank">打开站点 ↗</a></aside><main class="admin-content"><header class="content-header"><div><p class="eyebrow">PERSONAL TOOLBOX</p><h1 id="page-title">Dashboard</h1></div><p id="status">本地内容管理</p></header><section class="view active" data-view-panel="dashboard"><div class="stats-grid"><article class="stat-card"><small>WEBSITES</small><strong id="stat-websites">—</strong></article><article class="stat-card"><small>TOOLS</small><strong id="stat-tools">—</strong></article><article class="stat-card"><small>CATEGORIES</small><strong id="stat-categories">—</strong></article><article class="stat-card"><small>LAST UPDATE</small><strong>Today</strong></article></div><section class="panel dashboard-panel"><h2>Workspace status</h2><p>管理导航、工具包、分类和站点配置。所有内容保存到本地 JSON 与静态工具目录。</p></section></section><section class="view" data-view-panel="websites"><section class="panel"><h2>Websites</h2><form id="nav-form"><input type="hidden" name="originalId"><input name="id" placeholder="id" required><input name="name" placeholder="名称" required><input name="url" type="url" placeholder="https://example.com" required><input name="description" placeholder="描述"><input name="tags" placeholder="标签，用逗号分隔"><input name="category" placeholder="分类 id" required><input name="icon" placeholder="auto" value="auto"><input name="order" type="number" value="10"><label><input name="enabled" type="checkbox" checked> 启用</label><button class="primary">新增网址</button></form><div id="navigation"></div></section></section><section class="view" data-view-panel="tools"><section class="panel"><h2>Tools</h2><p class="muted">工具包上传与校验会生成静态工具入口。</p><form id="tool-upload"><div class="upload-copy"><strong>Upload a tool package</strong><small>ZIP / manifest.json / entry file · max 20MB</small></div><input name="file" type="file" accept=".zip,application/zip" required><button class="primary">上传工具包</button></form><div id="tools"></div></section></section><section class="view" data-view-panel="categories"><section class="panel"><h2>Categories</h2><form id="category-form"><input type="hidden" name="originalId"><input name="id" placeholder="id" required><input name="name" placeholder="名称" required><input name="icon" placeholder="图标，如 Code2" value="Code2"><input name="order" type="number" value="10"><button class="primary">新增分类</button></form><div id="categories"></div></section></section><section class="view" data-view-panel="settings"><section class="panel"><h2>Settings</h2><form id="site"></form></section></section></main></div><script type="module" src="/admin/admin.js"></script></body></html>
