<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工具开发模板</title>
  <meta name="description" content="支持独立使用、透明嵌入和主题同步的文本工具模板">
  <script>
    const embedded = window.parent !== window
    const systemTheme = matchMedia('(prefers-color-scheme: light)')
    document.documentElement.dataset.embedded = String(embedded)
    document.documentElement.dataset.theme = systemTheme.matches ? 'light' : 'dark'
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080c10; --panel: #11181e; --text: #edf2f5; --muted: #9caab6;
      --accent: #76ddef; --border: #303d48;
      font: 15px/1.6 system-ui, -apple-system, sans-serif;
      color: var(--text); background: var(--bg);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f5f7fa; --panel: #fff; --text: #172634; --muted: #526778;
      --accent: #086e84; --border: #c2cdd7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); }
    :root[data-embedded="true"], [data-embedded="true"] body { background: transparent; }
    main { width: 100%; max-width: 1120px; margin-inline: auto; padding: 24px; }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .field { display: grid; gap: 10px; min-width: 0; }
    label { font-weight: 600; }
    textarea {
      width: 100%; min-height: 230px; resize: vertical; padding: 14px;
      color: var(--text); background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; font: 14px/1.65 ui-monospace, monospace;
    }
    textarea::placeholder { color: var(--muted); opacity: 1; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .spacer { flex: 1; }
    button {
      min-height: 44px; padding: 9px 18px; border-radius: 10px;
      border: 1px solid var(--border); color: var(--text); background: var(--panel);
      font: inherit; font-weight: 600; cursor: pointer;
      transition: border-color 150ms ease, background-color 150ms ease;
    }
    button.primary { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
    button:hover:not(:disabled) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    #status { min-height: 1.6em; margin: 14px 0 0; color: var(--muted); overflow-wrap: anywhere; }
    @media (max-width: 640px) {
      main { padding: 16px; }
      .fields { grid-template-columns: minmax(0, 1fr); gap: 16px; }
      textarea { min-height: 150px; }
      .spacer { display: none; }
      button { flex: 1 1 40%; }
    }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <main aria-label="工具工作区">
    <div class="fields">
      <div class="field">
        <label for="input">输入内容</label>
        <textarea id="input" spellcheck="false" placeholder="在这里输入或粘贴文本…"></textarea>
      </div>
      <div class="field">
        <label for="output">处理结果</label>
        <textarea id="output" readonly spellcheck="false" placeholder="处理后的结果会显示在这里"></textarea>
      </div>
    </div>
    <div class="actions">
      <button class="primary" id="run" type="button">开始处理</button>
      <button id="clear" type="button">清空</button>
      <span class="spacer" aria-hidden="true"></span>
      <button id="copy" type="button" disabled>复制结果</button>
      <button id="download" type="button" disabled>下载结果</button>
    </div>
    <p id="status" role="status" aria-live="polite">输入内容后开始处理。</p>
  </main>
  <script>
    const input = document.getElementById('input')
    const output = document.getElementById('output')
    const status = document.getElementById('status')
    const copy = document.getElementById('copy')
    const download = document.getElementById('download')
    let revision = 0

    // 业务入口：把原文返回示例替换成你的同步处理逻辑；校验失败时 throw new Error('具体原因')。
    function transform(text) { return text }

    function refreshActions() { copy.disabled = download.disabled = output.value.length === 0 }
    input.addEventListener('input', () => {
      revision++
      refreshActions()
      status.textContent = output.value ? '输入已修改，请重新处理。当前结果保留。' : '输入内容后开始处理。'
    })
    document.getElementById('run').onclick = () => {
      revision++
      try {
        if (!input.value.length) throw new Error('请先输入内容。')
        const result = transform(input.value)
        if (typeof result !== 'string') throw new Error('处理结果必须是文本。')
        output.value = result
        status.textContent = result.length ? '处理完成，可以复制或下载。' : '处理完成，结果为空。'
      } catch (error) {
        status.textContent = (error instanceof Error ? error.message : '处理失败。') + (output.value ? ' 已保留上次结果。' : '')
      } finally { refreshActions() }
    }
    document.getElementById('clear').onclick = () => {
      revision++
      input.value = output.value = ''
      refreshActions()
      status.textContent = '已清空。'
      input.focus()
    }
    copy.onclick = async () => {
      const request = ++revision
      copy.disabled = true
      try {
        if (embedded) {
          if (!window.Toolbox) throw new Error('Bridge unavailable')
          await window.Toolbox.clipboard.writeText(output.value)
        } else {
          await navigator.clipboard.writeText(output.value)
        }
        if (request === revision) status.textContent = '已复制。'
      } catch {
        if (request === revision) {
          output.focus()
          output.select()
          status.textContent = '自动复制不可用，已选中结果，请按 Ctrl+C / ⌘C 手动复制。'
        }
      } finally { if (request === revision) refreshActions() }
    }
    download.onclick = () => {
      const url = URL.createObjectURL(new Blob([output.value], { type: 'text/plain;charset=utf-8' }))
      const link = document.createElement('a')
      link.href = url
      link.download = 'result.txt'
      document.body.append(link)
      link.click()
      link.remove()
      setTimeout(() => URL.revokeObjectURL(url), 1000)
      status.textContent = '已请求下载；未出现文件时，请检查浏览器及工具的下载权限。'
    }

    // 嵌入模式自行应用宿主主题；iframe 不会继承宿主 CSS。
    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme.mode === 'light' ? 'light' : 'dark'
      const tokens = { bg: 'bgPrimary', panel: 'bgSecondary', text: 'textPrimary', muted: 'textSecondary', accent: 'accent', border: 'borderColor' }
      for (const [name, key] of Object.entries(tokens)) {
        if (theme.colors?.[key]) document.documentElement.style.setProperty('--' + name, theme.colors[key])
      }
    }
    if (embedded) {
      const sdk = document.createElement('script')
      // 适用于安装后的 tools/{id}/index.html；修改 entry 层级时同步调整相对路径。
      sdk.src = '../../toolbox-bridge.js'
      sdk.onload = () => {
        window.Toolbox.theme.watch(theme => {
          applyTheme(theme)
          if (!theme.colors) window.Toolbox.theme.get().then(applyTheme).catch(() => {})
        })
        // 按内容本身上报，避免 iframe 视口高度让缩短后的内容无法回缩。
        window.Toolbox.resize.disableAuto()
        const main = document.querySelector('main')
        new ResizeObserver(() => window.Toolbox.resize.report(main.getBoundingClientRect().height)).observe(main)
      }
      sdk.onerror = () => { status.textContent = '主题连接不可用，仍可处理文本和手动复制。' }
      document.head.append(sdk)
    } else {
      systemTheme.addEventListener('change', event => applyTheme({ mode: event.matches ? 'light' : 'dark' }))
    }
  </script>
</body>
</html>
