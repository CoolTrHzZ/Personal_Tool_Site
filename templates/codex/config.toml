# Project-level: Sol leads, Luna executes.
# Provider-neutral by default. See config.gateway.example.toml for an optional
# OpenAI-compatible gateway example.
# Legacy Luna compatibility is opt-in:
#   bash scripts/prepare-luna-catalog.sh "$(pwd)/.codex/models-v1.json"
# then add model_catalog_json and the legacy feature flag only when required.

model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"

[features]
multi_agent = true

[agents]
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "high"
